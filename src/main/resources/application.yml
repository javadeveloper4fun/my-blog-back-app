# ===================================================================
# НАСТРОЙКИ SPRING BOOT ПРИЛОЖЕНИЯ (Блог)
# Спринт 4: Тема 6 «Настройка приложения» — конфигурация через файл
# (вместо Java-конфигурации спринта 3).
# Тема 8 «Мониторинг приложения с использованием Spring Boot Actuator».
# ===================================================================

spring:
  datasource:
    url: jdbc:h2:mem:blog;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:

  sql:
    init:
      mode: always

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
  info:
    build:
      enabled: true